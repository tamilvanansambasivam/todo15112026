<!doctype html>
<!-- Tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <!-- Lets the page show special characters correctly -->
    <meta charset="UTF-8" />
    <!-- Text shown on the browser tab -->
    <title>Todo App</title>
  </head>
  <body>
    <!-- Main title of the app. <h1> is the biggest heading on a page. -->
    <h1>My Todos</h1>

    <!-- Text box where the user types a new task.
       id="todo-input" is a name tag so JavaScript can find it later.
       placeholder is the grey hint text shown when the box is empty. -->
    <input type="text" id="todo-input" placeholder="What needs to be done?" />

    <!-- Button the user will click to add the task.
       id="add-btn" is a name tag for JavaScript to use later. -->
    <button id="add-btn">Add</button>

    <!-- Empty list where our tasks will appear.
       <ul> means "unordered list" (bullet points).
       id="todo-list" is a name tag so JavaScript can add tasks into it later. -->
    <ul id="todo-list"></ul>
  </body>
</html>
